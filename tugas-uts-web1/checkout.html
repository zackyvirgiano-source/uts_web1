<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Pemesanan | Pustaka UT</title>
  </head>
  <body data-page="checkout">
    <header class="topbar" id="topbar"></header>
    <main>
      <div class="page-head">
        <div>
          <h1>Laporan Pemesanan</h1>
          <p>Periksa pesananmu, lengkapi data, lalu bayar.</p>
        </div>
        <a class="btn ghost" href="stok.html">+ Tambah buku</a>
      </div>
      <div class="split">
        <section class="panel" aria-labelledby="hKeranjang">
          <h2 id="hKeranjang" style="margin-bottom: 0.6rem">Isi pesanan</h2>
          <div id="keranjang"></div>
          <div class="sum"><span>Subtotal</span><span id="sub">Rp 0</span></div>
          <div class="sum">
            <span>Ongkos kirim</span><span id="ongkir">Rp 0</span>
          </div>
          <div class="sum tot">
            <span>Total</span><span id="total">Rp 0</span>
          </div>
        </section>
        <section class="panel" aria-labelledby="hData">
          <h2 id="hData" style="margin-bottom: 1rem">Data pemesan</h2>
          <form id="formPesan" novalidate>
            <div class="field">
              <label for="nama">Nama lengkap</label><input id="nama" />
            </div>
            <div class="field">
              <label for="emailP">Email</label
              ><input type="email" id="emailP" />
            </div>
            <div class="field">
              <label for="telp">No. telepon</label
              ><input id="telp" inputmode="tel" placeholder="08xxxxxxxxxx" />
            </div>
            <div class="field">
              <label for="alamat">Alamat pengiriman</label
              ><textarea id="alamat" rows="3"></textarea>
            </div>
            <div class="row2" style="margin: 0 0 1rem">
              <div>
                <label for="ekspedisi">Ekspedisi</label
                ><select id="ekspedisi">
                  <option>JNE</option>
                  <option>Pos Indonesia</option>
                </select>
              </div>
              <div>
                <label for="bayar">Pembayaran</label
                ><select id="bayar">
                  <option value="">Pilih</option>
                  <option>Transfer Bank</option>
                  <option>QRIS</option>
                  <option>Bayar di Tempat (COD)</option>
                </select>
              </div>
            </div>
            <button class="btn saf" style="width: 100%" type="submit">
              Pesan sekarang
            </button>
          </form>
        </section>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
